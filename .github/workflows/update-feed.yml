name: Build & Sync OpenWrt opkg Feed

# 触发方式：
#  1) 定时（默认每天 03:00 北京时间 = 前一日 19:00 UTC，可自行调整 cron）
#  2) 手动（GitHub 页面点 Run workflow）
#  3) 修改 config/ 或 scripts/ 时自动触发
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'scripts/**'

# 同一时间只允许一个构建在跑，避免 R2 目录不一致
concurrency:
  group: feed-build
  cancel-in-progress: false

env:
  # R2 S3 兼容端点（账号 ID 决定）
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feed (拉取 ipk+apk + 生成 Packages / Packages.gz)
        run: |
          python scripts/build_feed.py \
            --config config/feed.json \
            --out dist \
            --work .work
        env:
          # 用 Actions 内置 token 访问 GitHub API（匿名会被限流 403）
          GH_TOKEN: ${{ github.token }}

      # apk 源的 v3 索引（packages.adb）必须用 apk-tools v3 的 mkndx 生成——
      # 它才能同时正确处理 v2(afrp) 与 v3(5gmodem/zwrt) 包并算出正确校验和。
      # 这里用 Docker 跑 Alpine(latest-stable, 自带 apk-tools 3.x)。
      #
      # OpenWrt 25.12+ 的 apk 对索引强制验签，未签名索引会报 UNTRUSTED signature，
      # 故用长期密钥（secret APK_SIGN_KEY，对应仓库内公钥 zwrt-feed.pem）对索引签名。
      - name: Prepare apk signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          mkdir -p signing
          if [ -z "${APK_SIGN_KEY}" ]; then
            echo "::warning::APK_SIGN_KEY 未配置，索引将不带签名（OpenWrt 25.12 会报 UNTRUSTED signature）"
            exit 0
          fi
          printf '%s\n' "${APK_SIGN_KEY}" > signing/zwrt-feed.key
          chmod 600 signing/zwrt-feed.key
          echo "signing key ready: $(wc -c < signing/zwrt-feed.key) bytes"

      - name: Generate apk v3 index (packages.adb) via apk mkndx
        run: |
          docker run --rm -v "$(pwd)/dist:/dist" -v "$(pwd)/signing:/signing" -w /dist alpine:latest sh -lc '
            echo "apk version: $(apk --version)"
            if [ -f /signing/zwrt-feed.key ]; then sign="--sign /signing/zwrt-feed.key"; else sign=""; fi
            echo "sign flag: ${sign:-<none>}"
            failed=0

            # 统一 apk 文件名为 <包名>-<版本>.apk。
            # 上游语言包资产叫 luci-i18n-5gmodem-zh-cn.apk（无版本号），而 apk 客户端
            # 按 <name>-<version>.apk 取包，名字对不上就 404。这里按包内元数据改名。
            for d in */; do
              d=${d%/}
              for f in /dist/$d/*.apk; do
                [ -f "$f" ] || continue
                dbg=$(apk adbdump "$f" 2>&1 | head -12)
                nm=$(printf "%s\n" "$dbg" | sed -nE "s/^[[:space:]]*-?[[:space:]]*name:[[:space:]]*(.*)$/\1/p" | head -1)
                vr=$(printf "%s\n" "$dbg" | sed -nE "s/^[[:space:]]*-?[[:space:]]*version:[[:space:]]*(.*)$/\1/p" | head -1)
                if [ -z "$nm" ] || [ -z "$vr" ]; then
                  echo "WARN cannot read name/version: $f"
                  printf "%s\n" "$dbg" | sed "s/^/    adbdump| /"
                  continue
                fi
                want="${nm}-${vr}.apk"
                if [ "$(basename "$f")" != "$want" ]; then
                  mv "$f" "/dist/$d/$want"
                  echo "renamed $(basename "$f") -> $want"
                fi
              done
            done

            for d in */; do
              d=${d%/}
              echo "===== $d ====="
              ls /dist/$d/*.apk 2>/dev/null || { echo "no apk in $d"; continue; }
              ( cd /dist/$d && apk mkndx --allow-untrusted $sign -o packages.adb ./*.apk 2>&1 | tail -30 )
              if [ -f /dist/$d/packages.adb ]; then echo "mkndx OK $d"; else echo "MKNDX MISSING $d"; failed=1; fi
              echo "--- files in $d ---"
              ls -la /dist/$d
            done
            exit $failed
          '

      # 验证：packages.adb 是 OpenWrt 风格（v3 ADB）索引，Alpine 容器里的 apk-tools 3.0.8
      # 只认 APKINDEX.tar.gz、不认 packages.adb，故无法用 apk fetch 从源抓包（测试环境限制）。
      # 这里用两项有效检查把关：① adbdump 确认每个架构目录索引非空、② apk verify 确认每个 apk 数据完整。
      # 最终端到端以 OpenWrt 25.12+ 设备上 apk update/apk add 为准。
      - name: Verify apk v3 feed (adbdump per-arch + apk verify integrity)
        run: |
          docker run --rm -v "$(pwd)/dist:/dist" -v "$(pwd)/signing:/signing:ro" -w /tmp alpine:latest sh -lc '
            echo "== apk v3 feed verify (adbdump + apk verify) =="
            ok=1
            for d in /dist/*/; do
              d=${d%/}
              d=${d#/dist/}
              echo "===== $d ====="
              test -f /dist/$d/packages.adb || { echo "NO packages.adb in $d"; ok=0; continue; }
              if [ -f /signing/zwrt-feed.pem ]; then
                apk adbdump /dist/$d/packages.adb 2>/dev/null | grep -qi "signature" \
                  && echo "$d: index is signed" \
                  || { echo "UNSIGNED index in $d <<<"; ok=0; }
              fi
              n=$(apk adbdump /dist/$d/packages.adb 2>/dev/null | grep -cE "^[[:space:]]*-[[:space:]]*name:" || true)
              echo "$d: $n packages indexed"
              [ "$n" -gt 0 ] || { echo "EMPTY index in $d <<<"; ok=0; }
              echo "--- apk verify --allow-untrusted each package ---"
              for f in /dist/$d/*.apk; do
                apk verify --allow-untrusted "$f" >/dev/null 2>&1 && echo "OK  $(basename $f)" || { echo "FAIL $(basename $f) <<<"; ok=0; }
                nm=$(apk adbdump "$f" 2>/dev/null | sed -nE "s/^[[:space:]]*-?[[:space:]]*name:[[:space:]]*(.*)$/\1/p" | head -1)
                vr=$(apk adbdump "$f" 2>/dev/null | sed -nE "s/^[[:space:]]*-?[[:space:]]*version:[[:space:]]*(.*)$/\1/p" | head -1)
                if [ -n "$nm" ] && [ -n "$vr" ] && [ "$(basename "$f")" != "${nm}-${vr}.apk" ]; then
                  echo "NAME MISMATCH $(basename $f) should be ${nm}-${vr}.apk <<<"; ok=0
                fi
              done
            done
            [ "$ok" = 1 ] && echo "== APK V3 FEED VERIFIED ==" || { echo "== APK V3 FEED HAS PROBLEMS, ABORT BEFORE SYNC =="; exit 1; }
          '

      - name: Publish feed public key into dist
        run: |
          cp zwrt-feed.pem dist/zwrt-feed.pem
          ls -la dist/zwrt-feed.pem

      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone R2 remote (临时，仅本 job 有效)
        run: |
          rclone config create r2 s3 \
            provider Cloudflare \
            access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}" \
            secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            endpoint "${{ env.R2_ENDPOINT }}" \
            acl private \
            env_auth false

      - name: Sync dist -> R2 bucket 的 packages/ 目录
        run: |
          rclone sync dist "r2:${{ secrets.R2_BUCKET }}/packages" \
            --fast-list \
            --transfers 8 \
            --checkers 8 \
            --log-level INFO

      # 双推：构建产物同时 rsync 到 VPS 备用源（mirror.zwrt.cc）。
      # 需先在仓库配置 5 个 secret（VPS_HOST / VPS_PORT / VPS_USER / VPS_SSH_KEY / VPS_PATH），
      # 并在 VPS 上装 rsync、建好目录、把 VPS_SSH_KEY 对应的公钥加入 authorized_keys。
      # 通过 env 传入 secrets（不能直接在 if: 里引用 secrets，否则 workflow 解析失败），
      # 未配置 VPS_HOST 时在 run 内跳过，不影响 R2 主源同步。
      - name: Sync dist -> VPS via rsync (备用源)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "${VPS_HOST}" ]; then
            echo "::warning::VPS_HOST 未配置，跳过 VPS 备用源同步"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_vps -p ${VPS_PORT:-22} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/packages/"

      - name: Build summary
        if: always()
        run: |
          echo "## Feed build result" >> $GITHUB_STEP_SUMMARY
          echo "- 包数：$(python - <<'PY'
          import glob
          n = len(glob.glob('dist/all/*.ipk'))
          print(n)
          PY
          )" >> $GITHUB_STEP_SUMMARY
          echo "- 架构索引：$(ls dist | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY
